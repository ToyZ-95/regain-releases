# ─────────────────────────────────────────────────────────────
# Deploy the download site + the latest APK to GitHub Pages.
# The APK is added at deploy time (never committed), so the repo doesn't grow per release.
# ─────────────────────────────────────────────────────────────
name: Deploy site

on:
  push:
    branches: [main]          # site edits (index.html, assets) go live
  release:
    types: [published]        # new release from Regain's pipeline → ship the new APK
  workflow_dispatch:          # manual "Run workflow" button, just in case

# Only what a Pages deployment needs. GITHUB_TOKEN is enough: everything stays in this repo.
permissions:
  contents: read              # read the site files + release assets
  pages: write                # publish to Pages
  id-token: write             # proves to Pages that this deploy came from this workflow

# Never run two deploys at once; finish the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout site
        uses: actions/checkout@v7

      # Put the newest release's APK next to index.html → served as download/regain.apk
      # on the SAME origin as the page (no GitHub-app interception, `download` attribute works).
      - name: Add latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p download
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern regain.apk --dir download --clobber; then
            ls -l download
          else
            echo "::warning::No release with regain.apk found; deploying the site without it."
          fi

      # Update manifest for the in-app updater: download/latest.json
      # (version read from the APK with aapt2, so the versionCode formula lives only in Regain's Gradle)
      - name: Write latest.json
        if: hashFiles('download/regain.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt,body,assets > "$RUNNER_TEMP/release.json"
          python3 .github/scripts/make_latest_json.py \
            download/regain.apk \
            "$RUNNER_TEMP/release.json" \
            "$ANDROID_HOME/build-tools/36.1.0/aapt2" \
            download/latest.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Bundles the folder (excludes .git, .github and dot-files) as the site artifact
      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # Why not actions/deploy-pages: it labels every deployment with GITHUB_SHA. A `release` event
      # runs on main's latest commit, which doesn't change between releases, so Pages saw a label it
      # had already served, reported "success" and kept the OLD site (v1.1.0 and v1.1.1 stayed 1.0.0).
      # Same API call it makes, but with a label that's unique per run (and per re-run).
      - name: Deploy to Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          # OIDC token proves this deploy came from this workflow (needs `id-token: write`)
          oidc_token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)

          response=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" \
            -F artifact_id="$ARTIFACT_ID" \
            -f pages_build_version="$BUILD_VERSION" \
            -f oidc_token="$oidc_token")
          deployment_id=$(jq -r .id <<< "$response")
          echo "page_url=$(jq -r .page_url <<< "$response")" >> "$GITHUB_OUTPUT"
          echo "Deployment $deployment_id ($BUILD_VERSION)"

          # Wait for Pages to finish (the job's 10-minute timeout is the upper bound)
          while true; do
            sleep 5
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$deployment_id" --jq .status)
            echo "Status: $status"
            case "$status" in
              succeed) break ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "::error::Pages deployment ended with: $status"; exit 1 ;;
            esac
          done
